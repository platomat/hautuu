          - name: contentWidth
            label: Inhaltsbreite
            widget: object
            collapsed: false
            hint: "Default-Breite pro Collection. Seite/Artikel: lokales Feld oder Listing-Embed kann „breit“ setzen. Kategorien, Tags, Autoren, Glossar: nur dieser Default."
            fields:
              - name: pages
                label: Seiten (Standard)
                widget: select
                options: &content_width_options
                  - { label: Standard (Lesespalte), value: default }
                  - { label: Breit, value: wide }
                  - { label: Vollbreit, value: full }
                default: default
              - name: articles
                label: Artikel (Standard)
                widget: select
                options: *content_width_options
                default: default
              - name: categories
                label: Kategorien (Standard)
                widget: select
                options: *content_width_options
                default: default
              - name: tags
                label: Tags (Standard)
                widget: select
                options: *content_width_options
                default: default
              - name: authors
                label: Autoren (Standard)
                widget: select
                options: *content_width_options
                default: default
              - name: glossar
                label: Glossar (Standard)
                widget: select
                options: *content_width_options
                default: default
          - name: spacing
            label: Inhaltsabstand
            widget: object
            collapsed: false
            hint: "Vertikaler Abstand unter dem Hero und vor dem Footer, pro Collection. Einzelne Seiten/Artikel überschreiben in der Gruppe Inhaltsbreite."
            fields:
              - name: pages
                label: Seiten
                widget: object
                fields: &fields_spacing_collection
                  - name: afterHero
                    label: Unter Hero (rem)
                    widget: number
                    value_type: float
                    min: 0
                    max: 12
                    step: 0.25
                    default: 2.5
                    required: true
                    hint: "Abstand zwischen Hero und TOC/Inhalt."
                  - name: beforeFooter
                    label: Vor Footer (rem)
                    widget: number
                    value_type: float
                    min: 0
                    max: 12
                    step: 0.25
                    default: 4
                    required: true
                    hint: "Unterer Innenabstand der Seite vor dem Footer."
              - name: articles
                label: Artikel
                widget: object
                fields: *fields_spacing_collection
              - name: categories
                label: Kategorien
                widget: object
                fields: *fields_spacing_collection
              - name: tags
                label: Tags
                widget: object
                fields: *fields_spacing_collection
              - name: authors
                label: Autoren
                widget: object
                fields: *fields_spacing_collection
              - name: glossar
                label: Glossar
                widget: object
                fields: *fields_spacing_collection

          - name: borderRadius
            label: Ecken abrunden
            widget: object
            collapsed: false
            hint: "Radius in Pixeln für Medien im Inhalt. Bilder und Videos getrennt. 0 = eckig."
            fields:
              - name: image
                label: Bilder (px)
                widget: number
                value_type: int
                min: 0
                max: 64
                default: 0
                required: true
                hint: "Markdown-/CMS-Bilder im Inhalt (nicht Logo, Avatar, Favicon)."
              - name: video
                label: Videos (px)
                widget: number
                value_type: int
                min: 0
                max: 64
                default: 0
                required: true
                hint: "Video-Embed und Member-Video (16:9-Box inkl. Facade)."

      - name: content
        label: Inhalt
        file: src/content/settings/content.json
        format: json
        fields:
          - name: toc
            label: Inhaltsverzeichnis (TOC)
            widget: object
            collapsed: false
            hint: "Globale TOC-Defaults. Einzelne Seiten/Artikel überschreiben mit ihren TOC-Feldern."
            fields:
              - name: pages
                label: Seiten
                widget: object
                fields:
                  - name: enabled
                    label: Standardmäßig anzeigen
                    widget: boolean
                    default: false
                  - name: levels
                    label: Ebenen
                    widget: select
                    multiple: true
                    options:
                      - { label: h2, value: h2 }
                      - { label: h3, value: h3 }
                      - { label: h4, value: h4 }
                    default: [h2]
                  - name: title
                    label: TOC-Titel
                    widget: string
                    default: Inhalt
              - name: articles
                label: Artikel
                widget: object
                fields:
                  - name: enabled
                    label: Standardmäßig anzeigen
                    widget: boolean
                    default: false
                  - name: levels
                    label: Ebenen
                    widget: select
                    multiple: true
                    options:
                      - { label: h2, value: h2 }
                      - { label: h3, value: h3 }
                      - { label: h4, value: h4 }
                    default: [h2]
                  - name: title
                    label: TOC-Titel
                    widget: string
                    default: Inhalt
          - name: media
            label: Medien
            widget: object
            collapsed: false
            hint: "Selbst gehostete Videos (z. B. Cloudflare R2). Dateien liegen nicht im Git-Repo."
            fields:
              - name: videoBaseUrl
                label: Video-Basis-URL
                widget: string
                required: false
                default: ""
                hint: "Öffentliche Basis-URL inkl. Pfad, z. B. https://media.hautoo.storyofai.net/videos/ — wird mit Dateiname aus dem Video-Embed zusammengesetzt. Leer = nur volle https-URLs im Embed."
              - name: videoAccessWorkerUrl
                label: Video-Access-Worker-URL
                widget: string
                required: false
                default: ""
                hint: "Basis-URL des Workers hautoo-member-media-access (ohne Slash am Ende), z. B. https://hautoo-member-media-access.ACCOUNT.workers.dev. Leer = Member-Video-Embeds zeigen Hinweis."
          - name: authors
            label: Autoren
            widget: object
            collapsed: false
            hint: "Anzeige auf der Artikel-Einzelseite. Profilseiten nutzen immer runde Avatare."
            fields:
              - name: articlePlacement
                label: Autoren auf Artikeln
                widget: select
                options:
                  - { label: Nicht anzeigen, value: none }
                  - { label: Im Hero, value: hero }
                  - { label: Am Ende des Artikels, value: after }
                  - { label: Hero und am Ende, value: both }
                default: hero
                required: true
              - name: avatarShape
                label: Avatar-Form (Artikel)
                widget: select
                options:
                  - { label: Rund, value: round }
                  - { label: Eckig, value: square }
                default: round
                required: true
          - name: footer
            label: Footer
            widget: object
            collapsed: false
            hint: "Brand oberhalb der Copyright-Zeile (#81); Breiten wie Inhaltsbreite. Copyright-Inhalt weiter unter General → Footer copyright."
            fields:
              - name: brand
                label: Brand
                widget: object
                collapsed: false
                hint: "Logo, Website-Beschreibung und Footer-Menü. Bausteine einzeln an/aus; Reihenfolge per Drag-and-Drop in der Liste."
                fields:
                  - name: enabled
                    label: Brand-Bereich anzeigen
                    widget: boolean
                    default: false
                    hint: "Aus = nur die Copyright-Zeile wie bisher."
                  - name: direction
                    label: Layout
                    widget: select
                    default: row
                    options:
                      - { label: "Nebeneinander (links → rechts)", value: row }
                      - { label: "Untereinander (oben → unten)", value: stack }
                  - name: align
                    label: Ausrichtung
                    widget: select
                    default: center
                    options:
                      - { label: "Start (oben bzw. links)", value: start }
                      - { label: "Mitte", value: center }
                      - { label: "Ende (unten bzw. rechts)", value: end }
                    hint: "Bei Nebeneinander: vertikale Ausrichtung der Bausteine. Bei Untereinander: horizontale Ausrichtung."
                  - name: menuLayout
                    label: Menü-Einträge
                    widget: select
                    default: row
                    options:
                      - { label: Nebeneinander, value: row }
                      - { label: Untereinander, value: stack }
                    hint: "Anordnung der Links im Footer-Menü (Baustein Menü)."
                  - name: contentWidth
                    label: Inhaltsbreite
                    widget: select
                    default: wide
                    options:
                      - { label: Standard (Lesespalte), value: default }
                      - { label: Breit, value: wide }
                      - { label: Vollbreit, value: full }
                    hint: "Maximale Breite der Brand-Zeile (42 / 64 / 80 rem)."
                  - name: logoSize
                    label: Logo-Größe (px)
                    widget: number
                    value_type: int
                    default: 44
                    min: 24
                    max: 160
                    hint: "Größe des Brand-Logos in der Footer-Brand-Zeile (Default 44)."
                  - name: menu
                    label: Menü
                    widget: relation
                    collection: menus
                    value_field: "{{slug}}"
                    search_fields: [title]
                    display_fields: ["{{title}} ({{slug}})"]
                    required: false
                    default: footer
                    hint: "Menü aus der Collection Menüs (Vorlage: footer). Leer = kein Brand-Menü. Legal-Links: Content → Footer → Copyright-Zeile → Legal-Menü."
                  - name: blocks
                    label: Bausteine (Reihenfolge)
                    widget: list
                    summary: "{{fields.id}} · {{fields.enabled}}"
                    allow_add: true
                    hint: "Einträge per Drag-and-Drop sortieren. Doppelte Baustein-Typen werden ignoriert (erster gewinnt)."
                    fields:
                      - name: id
                        label: Baustein
                        widget: select
                        default: logo
                        options:
                          - { label: Logo, value: logo }
                          - { label: Beschreibung, value: description }
                          - { label: Menü, value: menu }
                      - name: enabled
                        label: Anzeigen
                        widget: boolean
                        default: true
              - name: bar
                label: Copyright-Zeile
                widget: object
                collapsed: false
                hint: "Untere Zeile (©, Mitte, Rechtliches). Inhalt weiter unter General → Footer copyright."
                fields:
                  - name: contentWidth
                    label: Inhaltsbreite
                    widget: select
                    default: wide
                    options:
                      - { label: Standard (Lesespalte), value: default }
                      - { label: Breit, value: wide }
                      - { label: Vollbreit, value: full }
                    hint: "Maximale Breite der Copyright-Zeile (42 / 64 / 80 rem)."
                  - name: borderWidth
                    label: Border-Breite
                    widget: select
                    default: full
                    options:
                      - { label: Volle Browserbreite, value: full }
                      - { label: Wie Inhaltsbreite der Zeile, value: shell }
                    hint: "Oberer Rand der Copyright-Zeile: über die ganze Viewport-Breite oder nur so breit wie die Zeile (Shell)."
                  - name: menu
                    label: Legal-Menü
                    widget: relation
                    collection: menus
                    value_field: "{{slug}}"
                    search_fields: [title]
                    display_fields: ["{{title}} ({{slug}})"]
                    required: false
                    default: footer-legal
                    hint: "Menü rechts in der Copyright-Zeile (Vorlage: footer-legal). Leer = keine Legal-Links. Wie Brand → Menü und Header → Menü."

