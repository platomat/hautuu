---
# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json

backend:
  name: github
  repo: platomat/hautoo
  branch: main
  base_url: https://hautoo-sveltia-cms-auth.platomat.workers.dev

# PAT login for now; GitHub App + Cloudflare Worker later.
# Admin UI: /admin/ (src/pages/admin.html); config: this file.

# Shared media library (Sveltia “Uncategorized” / all assets).
# Files live in src/assets; frontmatter stores /assets/… — resolved by src/lib/cms-image.ts
media_folder: src/assets
public_folder: /assets

output:
  omit_empty_optional_fields: true

# Markdown/RichText defaults: no H1 in the body (page/article title is the Hero H1).
# Editors can still type `# ` in raw mode; `pattern` on body fields blocks Save then.
field_defaults:
  richtext:
    buttons:
      - bold
      - italic
      - strikethrough
      - code
      - link
      - heading-two
      - heading-three
      - heading-four
      - heading-five
      - heading-six
      - bulleted-list
      - numbered-list
      - quote

# -----------------------------------------------------------------------------
# Shared field partials (YAML anchors) — DRY across collections.
# Aliases only work inside THIS file. Inject with: - *field_seo
# Astro Zod mirrors: src/cms/fields/seo.ts, src/cms/fields/page-background.ts,
# src/cms/fields/status.ts, src/cms/fields/dates.ts
# -----------------------------------------------------------------------------

# Entry layout groups after modifiedDate (pages, articles):
# - *field_entry_hero
# - *field_entry_toc
# - *field_entry_background
# - *field_entry_layout  (Inhaltsbreite + Abstand Hero/Footer)

# Editorial status (pages, articles, glossar — not tags/menus)
# - *field_status
# - *field_publish_date  (pages/glossar; articles use pubDate)

# Last change (all collections; SEO meta only for now)
# - *field_modified_date

collections:

  - name: pages
    label: Seiten
    label_singular: Seite
    folder: src/content/pages
    create: true
    path: "{{slug}}/index"
    media_folder: ""
    public_folder: ""
    slug:
      template: "{{slug}}"
      editable: true
      hint: "URL-Teil und Dateiname. Beim Speichern wird der Eintrag umbenannt; Verweise werden angepasst."
    extension: md
    format: yaml-frontmatter
    # Nested image (auto-detect only sees top-level Image fields).
    thumbnail: background.image
    fields:
      - { name: title, label: Titel, widget: string }
      - { name: description, label: Beschreibung, widget: string, required: false }
      - &field_status
        name: status
        label: Status
        widget: select
        options:
          - { label: Entwurf, value: draft }
          - { label: Veröffentlicht, value: published }
          - { label: Geplant, value: future }
          - { label: Papierkorb, value: trash }
        default: draft
        required: true
        hint: "Nur „Veröffentlicht“ und fällige „Geplant“-Einträge erscheinen auf der Website."
      - &field_publish_date
        name: publishDate
        label: Veröffentlichungsdatum
        widget: datetime
        date_format: YYYY-MM-DD
        time_format: false
        required: false
        hint: "Für Status „Geplant“: ab diesem Datum öffentlich (nach dem nächsten Build)."
      - &field_modified_date
        name: modifiedDate
        label: Zuletzt geändert
        widget: datetime
        date_format: YYYY-MM-DD
        time_format: false
        required: false
        hint: "Letzte inhaltliche Änderung. Wird im Seitenkopf als SEO-Meta ausgegeben (noch nicht sichtbar auf der Seite)."
      - name: parent
        label: Übergeordnete Seite
        widget: relation
        collection: pages
        value_field: "{{slug}}"
        search_fields: [title]
        display_fields: [title]
        required: false
        hint: "Optional. URL wird /eltern-slug/diese-seite/."
      - &field_entry_hero
        name: hero
        label: Hero überschreiben
        widget: object
        collapsed: true
        required: false
        hint: "Nur setzen, wenn du die Defaults unter Einstellungen → Design → Hero überschreiben willst. Unberührt = nicht in der YAML."
        fields:
          - name: textAlign
            label: Textausrichtung
            widget: select
            required: false
            options:
              - { label: Links, value: left }
              - { label: Zentriert, value: center }
              - { label: Rechts, value: right }
            hint: "Leer = Collection-Default. Gilt für Brotkrumen, Titel und Beschreibung."
          - name: showBreadcrumbs
            label: Brotkrumen anzeigen
            widget: select
            required: false
            default: null
            options:
              - { label: Wie global, value: null }
              - { label: An, value: true }
              - { label: Aus, value: false }
            hint: "Wie global = Design → Hero. An/Aus nur bei bewusster Überschreibung."
          - name: borderBottom
            label: Trennlinie unten
            widget: select
            required: false
            default: null
            options:
              - { label: Wie global, value: null }
              - { label: Aus, value: none }
              - { label: Linie, value: line }
              - { label: Linie mit Logo, value: logo }
              - { label: Linie mit Favicon, value: favicon }
            hint: "Wie global = Design → Hero. Logo/Favicon wie beim Trennlinien-Embed."
          - name: borderMarkAlign
            label: Markierung Position
            widget: select
            required: false
            default: null
            options:
              - { label: Wie global, value: null }
              - { label: Links, value: left }
              - { label: Mitte, value: center }
              - { label: Rechts, value: right }
            hint: "Nur bei Logo oder Favicon. Wie global = Design → Hero."
          - name: borderMarkSize
            label: Markierung Größe (px)
            widget: number
            value_type: int
            required: false
            min: 8
            max: 120
            hint: "Nur bei Logo oder Favicon. Leer = Design → Hero (Standard 24)."
      - &field_entry_toc
        name: toc
        label: TOC überschreiben
        widget: object
        collapsed: true
        required: false
        hint: "Nur setzen zum Überschreiben von Einstellungen → Inhalt → TOC. Unberührt = nicht in der YAML."
        fields:
          - name: show
            label: Anzeigen
            widget: select
            required: false
            default: null
            options:
              - { label: Wie global, value: null }
              - { label: An, value: true }
              - { label: Aus, value: false }
            hint: "Wie global = Content → TOC für diese Collection. An/Aus nur bei bewusster Überschreibung."
          - name: title
            label: Titel
            widget: string
            required: false
            hint: "Leer = Titel aus der globalen Config."
          - name: levels
            label: Ebenen
            widget: select
            multiple: true
            options:
              - { label: h2, value: h2 }
              - { label: h3, value: h3 }
              - { label: h4, value: h4 }
            required: false
            hint: "Leer = Ebenen aus der globalen Config."
      - &field_entry_background
        name: background
        label: Seitenhintergrund einstellen
        widget: object
        collapsed: true
        required: false
        hint: "Optional. Vollflächig hinter der sichtbaren Seite (Viewport). Ohne Bild kein Hintergrund. Header und Footer bleiben darüber."
        fields:
          - name: image
            label: Bild
            widget: image
            required: false
          - name: overlay
            label: Abdunkelung (%)
            widget: number
            value_type: int
            min: 0
            max: 100
            required: false
            hint: "Nur bei Hintergrundbild. Leer = 40. 0 = keine Abdunkelung, 100 = fast schwarz."
          - name: attribution
            label: Bildnachweis
            widget: text
            required: false
            hint: "Text, reine URL oder HTML 1:1 von Unsplash/Pexels („Copy attribution“). Nur a-Links mit href werden übernommen; erscheint automatisch am Ende des Impressums."
      - &field_entry_layout
        name: layout
        label: Inhaltsbreite
        widget: object
        collapsed: true
        required: false
        hint: "Nur setzen zum Überschreiben. Felder leer = Defaults unter Einstellungen → Design → Inhaltsbreite / Abstand."
        fields:
          - name: contentWidth
            label: Spaltenbreite
            widget: select
            required: false
            options:
              - { label: Standard (Lesespalte), value: default }
              - { label: Breit, value: wide }
              - { label: Vollbreit, value: full }
            hint: "Leer = globale Config (Design → Inhaltsbreite). Listing-Embeds wählen ohne gesetztes Feld automatisch „Breit“."
          - name: afterHero
            label: Abstand unter Hero (rem)
            widget: number
            value_type: float
            min: 0
            max: 12
            step: 0.25
            required: false
            hint: "Leer = Design → Inhaltsabstand für diese Collection. Abstand zwischen Hero und TOC/Inhalt."
          - name: beforeFooter
            label: Abstand vor Footer (rem)
            widget: number
            value_type: float
            min: 0
            max: 12
            step: 0.25
            required: false
            hint: "Leer = Design → Inhaltsabstand für diese Collection. Unterer Innenabstand der Seite vor dem Footer."
      - name: body
        label: Inhalt
        widget: markdown
        hint: "Kein H1: Titel kommt aus dem Hero. Blöcke „Artikel-Listing“, „Kategorie-Listing“, „Tag-Listing“, „Tagwolke“, „Autoren-Listing“, „Autor Social-Links“, „Glossar-Listing“, „Baustein“, „Button“, „Button-Gruppe“, „Karten-Grid“, „Trennlinie“, „Abstandshalter“, „Kontakt-E-Mail“, „Video“, „Video-Freischaltung widerrufen“ und „Repo-Dokument“ über die Toolbar einfügen (wie Bilder)."
        pattern:
          - "/^(?![\\s\\S]*(^|\\n)#(?!#)\\s)/"
          - "Keine H1 (# …) im Inhalt. Die Überschrift kommt aus dem Hero (Feld Titel)."
        editor_components:
          - block
          - image
          - code-block
          - article-listing
          - category-listing
          - tag-listing
          - tag-cloud
          - author-listing
          - author-social
          - glossar-listing
          - button
          - button-group
          - grid-cards
          - separator
          - spacer
          - contact-email
          - logo
          - video
          - member-video
          - video-consent-reset
          - repodoc
      - &field_seo
        label: SEO
        name: seo
        widget: object
        required: true
        collapsed: true
        default:
          index_visibility: index
          follow_visibility: follow
          noarchive: false
          noimageindex: false
          nosnippet: false
          max_snippet_enabled: true
          max_snippet: -1
          max_video_preview_enabled: true
          max_video_preview: -1
          max_image_preview_enabled: true
          max_image_preview: large
        summary: "{{fields.seo_title}}"
        hint: "Titel, Meta Description und Robots. Beim Build → title-Tag, description und meta robots."
        fields:
          - label: SEO Title
            name: seo_title
            widget: string
            required: false
            hint: "Optional — leer lassen = Seitentitel (H1) wird beim Build verwendet."
          - label: Meta Description
            name: seo_description
            widget: text
            required: false
            hint: "Optional — Fallback: Feld Beschreibung der Seite."
          - label: Index / Noindex
            name: index_visibility
            widget: select
            options:
              - { label: Index, value: index }
              - { label: Kein Index (Noindex), value: noindex }
            default: index
            required: true
            hint: "Ob Suchmaschinen diese Seite in den Suchergebnissen aufnehmen (Index) oder ausblenden (Noindex)."
          - label: Follow / Nofollow
            name: follow_visibility
            widget: select
            options:
              - { label: Follow, value: follow }
              - { label: Nofollow, value: nofollow }
            default: follow
            required: true
            hint: "Ob Suchmaschinen Links auf dieser Seite folgen (Follow) oder ignorieren (Nofollow)."
          - label: Kein Archiv (Noarchive)
            name: noarchive
            widget: boolean
            default: false
            hint: "Suchmaschinen sollen keine zwischengespeicherte Version der Seite anzeigen."
          - label: Kein Bildverzeichnis (Noimageindex)
            name: noimageindex
            widget: boolean
            default: false
            hint: "Bilder auf dieser Seite nicht in der Google-Bildersuche indexieren."
          - label: Kein Snippet (Nosnippet)
            name: nosnippet
            widget: boolean
            default: false
            hint: "Keinen Textausschnitt (Snippet) in den Suchergebnissen anzeigen."
          - label: "Erweitert: Max Snippet"
            name: max_snippet_enabled
            widget: boolean
            default: true
            hint: "Begrenzung der Snippet-Länge in den Suchergebnissen aktivieren."
          - label: Max Snippet (Zeichen)
            name: max_snippet
            widget: number
            value_type: int
            default: -1
            required: false
            hint: "-1 = unbegrenzt"
          - label: "Erweitert: Max. Videovorschau"
            name: max_video_preview_enabled
            widget: boolean
            default: true
            hint: "Begrenzung der Videovorschau in den Suchergebnissen aktivieren."
          - label: Max. Videovorschau (Sekunden)
            name: max_video_preview
            widget: number
            value_type: int
            default: -1
            required: false
            hint: "-1 = unbegrenzt"
          - label: "Erweitert: Max. Bildvorschau"
            name: max_image_preview_enabled
            widget: boolean
            default: true
            hint: "Begrenzung der Bildvorschau in den Suchergebnissen aktivieren."
          - label: Max. Bildvorschaugröße
            name: max_image_preview
            widget: select
            options:
              - { label: Keine, value: none }
              - { label: Standard, value: standard }
              - { label: Groß, value: large }
            default: large
            required: false
            hint: "Maximale Bildgröße in der Google-Suchvorschau."
      - name: headCode
        label: Header-Code
        widget: code
        required: false
        output_code_only: true
        default_language: html
        allow_language_selection: false
        hint: "Optional. HTML-Fragmente vor dem schließenden head-Tag, nur diese Seite (nach globalem Site-Code unter Einstellungen → Allgemein). Style/script gemischt möglich. Nur für vertrauenswürdige Redaktion."
      - name: footerCode
        label: Footer-Code
        widget: code
        required: false
        output_code_only: true
        default_language: html
        allow_language_selection: false
        hint: "Optional. HTML-Fragmente vor dem schließenden body-Tag, nur diese Seite (nach globalem Site-Code). Nur für vertrauenswürdige Redaktion."

  - name: articles
    label: Artikel
    label_singular: Artikel
    folder: src/content/articles
    create: true
    path: "{{slug}}/index"
    media_folder: ""
    public_folder: ""
    slug:
      template: "{{slug}}"
      editable: true
      hint: "URL-Teil und Dateiname. Beim Speichern wird der Eintrag umbenannt; Verweise werden angepasst."
    extension: md
    format: yaml-frontmatter
    summary: "{{title}}"
    # Titelbild first, else nested page background.
    thumbnail:
      - heroImage
      - background.image
    hint: "Medien neben dem Eintrag (Variante B). URL: /artikel/slug/."
    fields:
      - { name: title, label: Titel, widget: string }
      - {
          name: summary,
          label: Zusammenfassung,
          widget: text,
          required: false,
        }
      - {
          name: pubDate,
          label: Publikationsdatum,
          widget: datetime,
          date_format: YYYY-MM-DD,
          time_format: false,
          required: true,
          hint: "Auch Termin für Status „Geplant“.",
        }
      - *field_status
      - *field_modified_date
      - {
          name: heroImage,
          label: Titelbild,
          widget: image,
          required: false,
          hint: "Upload landet neben index.md (Variante B). Bilder aus der Mediathek (/assets/…) gehen auch.",
        }
      - {
          name: showHeroImage,
          label: Titelbild auf Artikel-Seite,
          widget: boolean,
          default: true,
          required: false,
          hint: "An = Bild unter dem Hero auf der Einzelseite. Aus = nur Vorschaubild in Listings (z. B. wenn auf der Seite ein Video steht).",
        }
      - *field_entry_hero
      - *field_entry_toc
      - *field_entry_background
      - *field_entry_layout
      - name: categories
        label: Kategorien
        widget: relation
        collection: categories
        value_field: "{{slug}}"
        search_fields: [title]
        display_fields: [title]
        multiple: true
        required: false
        hint: "Optional. Hierarchische Themengruppen (Parent an der Kategorie selbst)."
      - name: tags
        label: Tags
        widget: relation
        collection: tags
        value_field: "{{slug}}"
        search_fields: [title]
        display_fields: [title]
        multiple: true
        required: false
      - name: tagPlacement
        label: Tags anzeigen
        widget: select
        options:
          - { label: Im Hero (neben Kategorien), value: hero }
          - { label: Nach dem Inhalt, value: after }
          - { label: Hero und nach dem Inhalt, value: both }
        default: hero
        required: false
        hint: "Kategorien stehen immer im Hero unter der Beschreibung. Tags wahlweise dort (rechts daneben), nach dem Inhalt (vor der Artikel-Navigation) oder beides."
      - name: authors
        label: Autoren
        widget: relation
        collection: authors
        value_field: "{{slug}}"
        search_fields: [title]
        display_fields: [title]
        multiple: true
        required: false
        hint: "Optional. Keiner, einer oder mehrere Autoren (Profil unter /autoren/slug/)."
      - name: body
        label: Inhalt
        widget: markdown
        hint: "Kein H1: Titel kommt aus dem Hero. Blöcke „Artikel-Listing“, „Kategorie-Listing“, „Tag-Listing“, „Tagwolke“, „Autoren-Listing“, „Autor Social-Links“, „Glossar-Listing“, „Baustein“, „Button“, „Button-Gruppe“, „Karten-Grid“, „Trennlinie“, „Abstandshalter“, „Kontakt-E-Mail“, „Video“, „Video-Freischaltung widerrufen“ und „Repo-Dokument“ über die Toolbar einfügen (wie Bilder)."
        pattern:
          - "/^(?![\\s\\S]*(^|\\n)#(?!#)\\s)/"
          - "Keine H1 (# …) im Inhalt. Die Überschrift kommt aus dem Hero (Feld Titel)."
        editor_components:
          - block
          - image
          - code-block
          - article-listing
          - category-listing
          - tag-listing
          - tag-cloud
          - author-listing
          - author-social
          - glossar-listing
          - button
          - button-group
          - grid-cards
          - separator
          - spacer
          - contact-email
          - logo
          - video
          - member-video
          - video-consent-reset
          - repodoc
      - *field_seo


  - name: categories
    label: Kategorien
    label_singular: Kategorie
    folder: src/content/categories
    create: true
    slug:
      template: "{{slug}}"
      editable: true
      hint: "URL-Teil und Dateiname. Beim Speichern wird der Eintrag umbenannt; Verweise werden angepasst."
    extension: md
    format: yaml-frontmatter
    summary: "{{title}}"
    hint: "Hierarchische Themen für Artikel (wie WordPress). Optional Parent. Dateiname = Slug. URL: /kategorien/slug/."
    fields:
      - { name: title, label: Name, widget: string }
      - {
          name: description,
          label: Beschreibung,
          widget: text,
          required: false,
        }
      - name: parent
        label: Übergeordnete Kategorie
        widget: relation
        collection: categories
        value_field: "{{slug}}"
        search_fields: [title]
        display_fields: [title]
        required: false
        hint: "Optional. Bildet eine Hierarchie; die öffentliche URL bleibt flach (/kategorien/slug/)."
      - *field_modified_date

  - name: tags
    label: Tags
    label_singular: Tag
    folder: src/content/tags
    create: true
    slug:
      template: "{{slug}}"
      editable: true
      hint: "URL-Teil und Dateiname. Beim Speichern wird der Eintrag umbenannt; Verweise werden angepasst."
    extension: md
    format: yaml-frontmatter
    summary: "{{title}}"
    hint: "Schlagworte für Artikel. Dateiname = Slug."
    fields:
      - { name: title, label: Name, widget: string }
      - {
          name: description,
          label: Beschreibung,
          widget: text,
          required: false,
        }
      - *field_modified_date


  - name: authors
    label: Autoren
    label_singular: Autor
    folder: src/content/authors
    create: true
    slug:
      template: "{{slug}}"
      editable: true
      hint: "URL-Teil und Dateiname. Beim Speichern wird der Eintrag umbenannt; Verweise werden angepasst."
    extension: md
    format: yaml-frontmatter
    summary: "{{title}}"
    hint: "Autoren für Artikel. Dateiname = Slug. Profil: /autoren/slug/. Bio und optional freier Inhalt mit Embeds."
    fields:
      - { name: title, label: Name, widget: string }
      - {
          name: description,
          label: Kurzbeschreibung,
          widget: text,
          required: false,
          hint: "Optional für Meta/Übersicht. Die ausführliche Bio steht im Feld Bio.",
        }
      - {
          name: avatar,
          label: Avatar,
          widget: image,
          required: false,
          hint: "Lokales Bild aus der Mediathek. Hat Vorrang vor Gravatar.",
        }
      - {
          name: gravatarUrl,
          label: Gravatar (E-Mail oder URL),
          widget: string,
          required: false,
          hint: "E-Mail (MD5 → Gravatar) oder https-Bild-URL. Beim Build nach src/assets/authors/gravatar/ heruntergeladen.",
        }
      - *field_modified_date
      - name: bio
        label: Bio
        widget: markdown
        required: false
        hint: "Kurze Beschreibung (Markdown). Erscheint auf der Profilseite unter Name und Avatar."
      - name: socialLinks
        label: Social / Web
        widget: list
        required: false
        collapsed: true
        hint: "Beliebig viele Einträge (auch dieselbe Plattform mehrfach). Auf dem Profil mit Plattform-Icons; schema.org sameAs. Platzierung im Inhalt: Embed „Autor Social-Links“."
        summary: "{{fields.platform}}: {{fields.url}}"
        fields:
          - name: platform
            label: Plattform
            widget: select
            default: website
            options:
              - { label: Webseite, value: website }
              - { label: YouTube, value: youtube }
              - { label: Facebook, value: facebook }
              - { label: Instagram, value: instagram }
              - { label: Pinterest, value: pinterest }
              - { label: LinkedIn, value: linkedin }
              - { label: TikTok, value: tiktok }
              - { label: X, value: x }
              - { label: Mastodon, value: mastodon }
              - { label: GitHub, value: github }
              - { label: Sonstiges, value: other }
          - name: url
            label: URL
            widget: string
            hint: "Vollständige Adresse mit https://"
          - name: label
            label: Anzeigename
            widget: string
            required: false
            hint: "Optional, z. B. eigener Text bei Webseite oder Sonstiges. Leer = Plattformname."
      - name: showSocialInHero
        label: Social-Links im Hero
        widget: boolean
        required: false
        default: false
        hint: "An: Social-Links nach der Kurzbeschreibung im Hero. Unabhängig vom Embed „Autor Social-Links“ im Inhalt (beides möglich)."
      - *field_entry_background
      - name: body
        label: Inhalt
        widget: markdown
        required: false
        hint: "Optionaler freier Inhalt mit Embeds (Artikel-Listing, Autor Social-Links, Buttons, …). Wenn gesetzt, ersetzt das automatische Artikel-Listing auf dem Profil. Social-Links: Embed „Autor Social-Links“ (ohne Autor = dieser Profilautor). Für eigene Artikel: Artikel-Listing mit Filter Autoren = dieser Autor."
        pattern:
          - "/^(?![\\s\\S]*(^|\\n)#(?!#)\\s)/"
          - "Keine H1 (# …) im Inhalt. Die Überschrift kommt aus dem Hero (Feld Name)."
        editor_components:
          - block
          - image
          - code-block
          - article-listing
          - category-listing
          - tag-listing
          - tag-cloud
          - author-listing
          - author-social
          - glossar-listing
          - button
          - button-group
          - grid-cards
          - separator
          - spacer
          - contact-email
          - logo
          - video
          - member-video
          - video-consent-reset
          - repodoc
      - *field_seo

  - name: glossar
    label: Glossar
    label_singular: Begriff
    folder: src/content/glossar
    create: true
    slug:
      template: "{{slug}}"
      editable: true
      hint: "URL-Teil und Dateiname. Beim Speichern wird der Eintrag umbenannt; Verweise werden angepasst."
    extension: md
    format: yaml-frontmatter
    summary: "{{title}}"
    hint: "Fachbegriffe. URL: /glossar/slug/."
    fields:
      - { name: title, label: Begriff, widget: string }
      - *field_status
      - *field_publish_date
      - *field_modified_date
      - {
          name: definition,
          label: Kurzdefinition,
          widget: text,
          hint: "Ein bis drei Sätze — erscheint in der Glossar-Liste.",
        }
      - name: relatedArticles
        label: Verwandte Artikel
        widget: relation
        collection: articles
        value_field: "{{slug}}"
        search_fields: [title]
        display_fields: [title]
        multiple: true
        required: false
      - name: relatedTags
        label: Verwandte Tags
        widget: relation
        collection: tags
        value_field: "{{slug}}"
        search_fields: [title]
        display_fields: [title]
        multiple: true
        required: false
        hint: "Zusätzlich zum automatischen Tag mit gleichem Slug (z. B. Glossar astro → #astro)."
      - name: body
        label: Längere Erklärung
        widget: markdown
        required: false
        hint: "Kein H1: der Glossar-Titel steht im Hero."
        pattern:
          - "/^(?![\\s\\S]*(^|\\n)#(?!#)\\s)/"
          - "Keine H1 (# …) im Inhalt. Der Begriffstitel kommt aus dem Hero."

      - *field_seo

  - name: blocks
    label: Bausteine
    label_singular: Baustein
    folder: src/content/blocks
    create: true
    slug:
      template: "{{slug}}"
      editable: true
      hint: "URL-Teil und Dateiname. Beim Speichern wird der Eintrag umbenannt; Verweise werden angepasst."
    extension: md
    format: yaml-frontmatter
    summary: "{{title}} ({{slug}})"
    hint: "Wiederverwendbare Inhaltsstücke ohne eigene URL. Einbinden mit Toolbar „Baustein“ bzw. {{block id=\"slug\"}}."
    fields:
      - {
          name: title,
          label: Titel,
          widget: string,
          hint: "Nur im CMS. Der Dateiname/Slug ist die id für {{block id=\"…\"}}.",
        }
      - *field_status
      - *field_publish_date
      - *field_modified_date
      - name: body
        label: Inhalt
        widget: markdown
        hint: "Kein H1 im Baustein-Inhalt (Seiten-/Artikeltitel kommt aus dem Hero). Gleicher Markdown-Editor wie bei Seiten; kann Listings, Bilder und weitere Bausteine enthalten."
        pattern:
          - "/^(?![\\s\\S]*(^|\\n)#(?!#)\\s)/"
          - "Keine H1 (# …) im Inhalt. Die Seitenüberschrift kommt aus dem Hero, nicht aus dem Baustein."
        editor_components:
          - block
          - image
          - code-block
          - article-listing
          - category-listing
          - tag-listing
          - tag-cloud
          - author-listing
          - author-social
          - glossar-listing
          - button
          - button-group
          - grid-cards
          - separator
          - spacer
          - contact-email
          - logo
          - video
          - member-video
          - video-consent-reset
          - repodoc

  # Menus: filename = slot id (main, footer-legal, …). Navigation is not driven by page flags.
  - name: menus
    label: Menüs
    label_singular: Menü
    folder: src/content/menus
    create: true
    slug:
      template: "{{slug}}"
      editable: true
      hint: "URL-Teil und Dateiname. Beim Speichern wird der Eintrag umbenannt; Verweise werden angepasst."
    extension: md
    format: yaml-frontmatter
    summary: "{{title}} ({{slug}})"
    hint: "Bekannte Slugs: main (Hauptmenü), footer (Brand-Bereich im Footer), footer-legal (Copyright-Zeile)."
    fields:
      - {
          name: title,
          label: Titel,
          widget: string,
          hint: "Anzeige im CMS (z. B. Hauptmenü). Der Dateiname/Slug steuert, wo das Menü erscheint.",
        }
      - *field_modified_date
      - name: items
        label: Einträge
        widget: list
        summary: "{{fields.label}}"
        fields:
          - { name: label, label: Label, widget: string }
          - name: linkType
            label: Link-Art
            widget: select
            options:
              - { label: Seite, value: page }
              - { label: URL, value: url }
            default: page
            required: true
          - name: page
            label: Seite
            widget: relation
            collection: pages
            value_field: "{{slug}}"
            search_fields: [title]
            display_fields: [title]
            required: false
            hint: "Bei Link-Art „Seite“."
          - {
              name: url,
              label: URL,
              widget: string,
              required: false,
              hint: "Bei Link-Art „URL“ — intern (/pfad/) oder https://…",
            }
          - {
              name: cssClass,
              label: CSS-Klasse,
              widget: string,
              required: false,
              hint: "Optional am a-Link (wie WordPress). Mehrere Klassen mit Leerzeichen, z. B. btn highlight.",
            }
          - name: children
            label: Untermenü
            widget: list
            required: false
            summary: "{{fields.label}}"
            hint: "Eine Ebene Unterpunkte (optional)."
            fields:
              - { name: label, label: Label, widget: string }
              - name: linkType
                label: Link-Art
                widget: select
                options:
                  - { label: Seite, value: page }
                  - { label: URL, value: url }
                default: page
                required: true
              - name: page
                label: Seite
                widget: relation
                collection: pages
                value_field: "{{slug}}"
                search_fields: [title]
                display_fields: [title]
                required: false
              - {
                  name: url,
                  label: URL,
                  widget: string,
                  required: false,
                }
              - {
                  name: cssClass,
                  label: CSS-Klasse,
                  widget: string,
                  required: false,
                  hint: "Optional am a-Link. Mehrere Klassen mit Leerzeichen.",
                }

# Redirects: each entry = one target, one or more source paths → public/_redirects at build.
  - name: redirects
    label: Weiterleitungen
    label_singular: Weiterleitung
    folder: src/content/redirects
    create: true
    slug:
      template: "{{slug}}"
      editable: true
      hint: "Nur Dateiname im CMS; öffentliche URLs stehen in Quellen und Ziel."
    extension: md
    format: yaml-frontmatter
    summary: "{{title}} → {{target}}"
    hint: "Manuelle URL-Umleitungen (gelöscht/verschoben). Mehrere Quellen, ein Ziel. Beim Build → Cloudflare _redirects (301/302)."
    fields:
      - {
          name: title,
          label: Titel,
          widget: string,
          hint: "Nur im CMS (z. B. „Alter Artikel-Slug“).",
        }
      - name: sources
        label: Quellen
        widget: list
        summary: "{{fields.source}}"
        min: 1
        allow_add: true
        hint: "Eine oder mehrere Quell-Pfade (z. B. /alter-pfad/). Jede Quelle leitet auf das gleiche Ziel um."
        field:
          {
            name: source,
            label: Quelle,
            widget: string,
            hint: "Pfad ab / (ohne Domain).",
          }
      - {
          name: target,
          label: Ziel,
          widget: string,
          hint: "Ein Ziel-Pfad (/neuer-pfad/) oder absolute https-URL.",
        }
      - name: code
        label: Statuscode
        widget: select
        default: 301
        options:
          - { label: "301 dauerhaft (empfohlen)", value: 301 }
          - { label: "302 vorübergehend", value: 302 }
        hint: "301 wenn Inhalt dauerhaft umgezogen ist."
      - *field_modified_date

  # Global settings (JSON files, like cdr-legal). Separate CMS entries per area.
  - name: settings
    label: Einstellungen
    label_singular: Einstellung
    delete: false
    files:
      - name: general
        label: Allgemein
        file: src/content/settings/general.json
        format: json
        fields:
          - name: websiteTitle
            label: Website title
            widget: string
            required: true
            hint: "Markenname in Header, Browser-Titel-Suffix und og:site_name."
            default: hautuu
          - name: websiteDescription
            label: Website description
            widget: text
            required: false
            hint: "Kurze Beschreibung oder Slogan. Im Footer-Brand (Content → Footer), wenn Baustein Beschreibung an ist. Erlaubt einfaches HTML: a, b/strong, em/i, br."
            default: ""
          - name: contactEmail
            label: Contact email
            widget: string
            required: false
            hint: "Optional für {{contact-email}} (Impressum/Datenschutz). Überschreibt CONTACT_EMAIL beim Build. Steht im öffentlichen Repo; leer lassen und ENV nutzen, wenn die Adresse nicht in Git soll."
            default: ""
          - name: privacyPage
            label: Privacy page
            widget: relation
            collection: pages
            value_field: "{{slug}}"
            search_fields: [title]
            display_fields: [title]
            required: false
            hint: "Datenschutz-Seite (wie WordPress Privacy Policy). Wird u. a. im Video-Consent-Hinweis verlinkt. Leer = kein Link."
            default: ""
          - name: logos
            label: Logos
            widget: object
            collapsed: false
            hint: "Aus der Mediathek (z. B. `/assets/logo-mark.svg`). Leer = Fallback `/assets/logo-mark.svg`. Darstellung mit den Farben der Datei."
            fields:
              - name: header
                label: Header
                widget: image
                required: false
                hint: "Logo neben dem Website-Titel im Header. Leer = Mediathek `/assets/logo-mark.svg`."
              - name: headerSticky
                label: Sticky Header
                widget: image
                required: false
                hint: "Optional anderes Logo, wenn der Header sticky „festklebt“. Leer = gleiches wie Header."
              - name: footer
                label: Footer
                widget: image
                required: false
                hint: "Footer-Mitte, wenn Show center mark an und kein GitHub-Repo gesetzt ist. Leer = gleiches wie Header."
          - name: favicons
            label: Favicons
            widget: object
            collapsed: false
            hint: "Aus der Mediathek (SVG oder PNG, z. B. `/assets/favicon.svg`). Leer = Fallback `/assets/favicon.svg`."
            fields:
              - name: default
                label: Favicon
                widget: image
                required: false
                hint: "Browser-Tab-Icon (helles System bzw. Fallback). Leer = Mediathek `/assets/favicon.svg`."
              - name: dark
                label: Favicon (dunkel)
                widget: image
                required: false
                hint: "Optional für prefers-color-scheme: dark. Leer = gleiches wie Favicon (Standard-SVG passt sich selbst an)."
          - name: footerCopyright
            label: Footer-Copyright
            widget: object
            collapsed: false
            hint: "Copyright-Zeile im Footer: Startjahr, Claim, Mitte optional Mark/Icon."
            fields:
              - name: startYear
                label: Startjahr
                widget: number
                required: true
                default: 2026
                value_type: int
                min: 1970
                max: 2100
                hint: "Jahr, in dem das Projekt begann. Aktuelles Jahr allein; später Startjahr–aktuelles Jahr."
              - name: claim
                label: Claim
                widget: text
                required: false
                default: ""
                hint: "Text, reine URL oder einfaches HTML (a mit href, b/strong, i/em, br). Leer = nur © und Website-Titel."
              - name: separator
                label: Trenner
                widget: select
                options:
                  - { label: "•", value: "•" }
                  - { label: "-", value: "-" }
                  - { label: "—", value: "—" }
                  - { label: "/", value: "/" }
                default: "•"
                required: true
                hint: "Zeichen zwischen Website-Titel und Claim."
              - name: showCenterLogo
                label: Center-Logo anzeigen
                widget: boolean
                required: false
                default: true
                hint: "Logo/Icon in der Mitte der Copyright-Zeile. An = GitHub-Icon bei gesetztem Repo, sonst Site-Logo zur Startseite. Aus = nichts in der Mitte."
          - name: githubRepo
            label: GitHub-Repository
            widget: string
            required: false
            hint: "Optional owner/name für das Footer-Icon (z. B. platomat/hautoo). Leer = Site-Logo verlinkt auf die Startseite (typisch für Forks). Wirkt nur, wenn Footer-Copyright → Center-Logo anzeigen an ist."
            default: ""
          - name: siteCode
            label: Site-Code
            widget: object
            collapsed: true
            hint: "Globale HTML-Fragmente für alle Seiten (wie Header-/Footer-Code an einzelnen Seiten). Global zuerst, Seiten-Code danach. Nur für vertrauenswürdige Redaktion."
            fields:
              - name: headCode
                label: Header-Code
                widget: code
                required: false
                output_code_only: true
                default_language: html
                allow_language_selection: false
                hint: "Optional. Vor dem schließenden head-Tag auf jeder Seite (style/script gemischt möglich). Seiten können zusätzlichen Header-Code setzen."
              - name: footerCode
                label: Footer-Code
                widget: code
                required: false
                output_code_only: true
                default_language: html
                allow_language_selection: false
                hint: "Optional. Vor dem schließenden body-Tag auf jeder Seite (nach dem Site-Footer). Seiten können zusätzlichen Footer-Code setzen."
      - name: maintenance
        label: Wartungsmodus
        file: src/content/settings/maintenance.json
        format: json
        fields:
          - name: enabled
            label: Aktiv
            widget: boolean
            required: false
            default: false
            hint: "An = online sehen Besucher nur die Wartungsseite (Titel, Text, Hintergrund, Copyright-Footer), nicht den normalen Inhalt. Lokal beim Bearbeiten bleibt die Site sichtbar; oben erscheint ein Hinweis mit Link zur Vorschau."
          - name: title
            label: Titel
            widget: string
            required: true
            default: Wartungsarbeiten
            hint: "H1 auf der Wartungsseite und SEO-/Browser-Titel."
          - name: description
            label: Beschreibung
            widget: markdown
            required: false
            default: "Die Website wird gerade überarbeitet. Bitte schau später wieder vorbei."
            hint: "Kurzer Markdown-Text unter dem Titel."
          - name: background
            label: Hintergrund
            widget: object
            collapsed: false
            required: false
            hint: "Optional. Vollflächig hinter dem zentrierten Text (wie bei Seiten)."
            fields:
              - name: image
                label: Bild
                widget: image
                required: false
              - name: overlay
                label: Abdunkelung (%)
                widget: number
                value_type: int
                min: 0
                max: 100
                required: false
                default: 70
                hint: "Nur bei Hintergrundbild. Leer = 40. 0 = keine Abdunkelung, 100 = fast schwarz."
      - name: design
        label: Design
        file: src/content/settings/design.json
        format: json
        fields:
          - name: colors
            label: Farbpalette
            widget: object
            collapsed: false
            hint: "CSS-Farben der Site (--color-*). Änderungen gelten nach Speichern und Deploy auf der ganzen Website."
            fields:
              - name: bg
                label: Hintergrund (bg)
                widget: color
                allowInput: true
                default: "#0f1412"
                hint: "Seitenhintergrund hinter Inhalt und Chrome."
              - name: surface
                label: Fläche (surface)
                widget: color
                allowInput: true
                default: "#1a211e"
                hint: "Solide UI-Flächen im Inhalt: Karten, Panels, Avatar-Hintergrund, Suchfeld, Mobile-Menü. Nicht Header/Footer (dafür Fläche Glas) und nicht Code (dafür Fläche angehoben)."
              - name: surfaceGlass
                label: Fläche Glas (surface-glass)
                widget: color
                enableAlpha: true
                allowInput: true
                default: "#1a211ee6"
                hint: "Hintergrund von Header und Footer bei Alpha unter 1. Das ist die Chrome-Farbe oben und unten. Bei Alpha 1 greifen Header/Footer auf Fläche zurück; leer = aus Fläche abgeleitet."
              - name: surfaceRaised
                label: Fläche angehoben (surface-raised)
                widget: color
                allowInput: true
                default: "#232b27"
                hint: "Leicht angehoben gegenüber Fläche: Inline-Code, Codeblöcke, manche Hinweisboxen."
              - name: border
                label: Rahmen (border)
                widget: color
                allowInput: true
                default: "#2e3833"
                hint: "Linien, Trenner, Kartenrahmen, Avatar-Rand, Trennlinien-Default."
              - name: text
                label: Text (text)
                widget: color
                allowInput: true
                default: "#e8eeea"
                hint: "Haupttext und starke Beschriftungen."
              - name: textMuted
                label: Text gedämpft (text-muted)
                widget: color
                allowInput: true
                default: "#9aa89f"
                hint: "Nebentext, Meta, Captions, schwächere UI-Labels."
              - name: action
                label: Aktion (action)
                widget: color
                allowInput: true
                default: "#3dcf8e"
                hint: "Primärfarbe: Links, Buttons, Fokusringe, aktive Akzente."
              - name: actionHover
                label: Aktion Hover (action-hover)
                widget: color
                allowInput: true
                default: "#56d9a0"
                hint: "Hover-/Active-Zustand der Aktionsfarbe."
              - name: actionMuted
                label: Aktion gedämpft (action-muted)
                widget: color
                allowInput: true
                default: "#1a3d2e"
                hint: "Dezenter Aktions-Hintergrund (Chips, Hover-Flächen, Outline-Button-Hover)."
              - name: danger
                label: Gefahr (danger)
                widget: color
                allowInput: true
                default: "#e57373"
                hint: "Fehler und destruktive Hinweise."
              - name: submenuBg
                label: Untermenü Hintergrund (submenu-bg)
                widget: color
                enableAlpha: true
                allowInput: true
                default: "#1a211e"
                hint: "Hintergrund der Nav-Untermenüs (Desktop-Flyout und Mobile-Akkordeon). Standard: solide Fläche, damit Einträge über Glas-Header/Seiten-BG lesbar bleiben."
              - name: submenuText
                label: Untermenü Text (submenu-text)
                widget: color
                allowInput: true
                default: "#e8eeea"
                hint: "Textfarbe der Links im Untermenü (Hover bleibt Aktionsfarbe)."
          - name: typography
            label: Schrift
            widget: object
            collapsed: false
            hint: "Schriften: Fontsource-Katalog plus eigene unter src/fonts/custom/id/ (stylesheet.css). Build liefert lokal aus public/fonts/."
            fields:
              - name: bodyFont
                label: Basis-Schriftart
                widget: select
                required: true
                default: ubuntu
                options: &font_family_options
                  - { label: "Ubuntu", value: ubuntu }
                  - { label: "Inter", value: inter }
                  - { label: "Open Sans", value: open-sans }
                  - { label: "Source Sans 3", value: source-sans-3 }
                  - { label: "Roboto", value: roboto }
                  - { label: "Lato", value: lato }
                  - { label: "Nunito Sans", value: nunito-sans }
                  - { label: "IBM Plex Sans", value: ibm-plex-sans }
                  - { label: "Merriweather", value: merriweather }
                  - { label: "Lora", value: lora }
                  - { label: "Source Serif 4", value: source-serif-4 }
                hint: "Schrift für Fließtext und UI. Wird beim Build lokal eingebettet."
              - name: baseSize
                label: Basisgröße (px)
                widget: number
                value_type: int
                min: 12
                max: 24
                default: 16
                required: true
                hint: "html font-size. Alle rem-Angaben (Überschriften) beziehen sich darauf."
              - name: bodyWeight
                label: Fließtext-Stärke
                widget: select
                required: true
                default: "300"
                options: &font_weight_options
                  - { label: "300 Light", value: "300" }
                  - { label: "400 Regular", value: "400" }
                  - { label: "500 Medium", value: "500" }
                  - { label: "600 Semibold", value: "600" }
                  - { label: "700 Bold", value: "700" }
                hint: "Fehlt der Schnitt bei der Schrift, wählt der Build den nächsten verfügbaren."
              - name: headingFont
                label: Überschriften-Schriftart
                widget: select
                required: true
                default: ubuntu
                options: *font_family_options
                hint: "Kann von der Basis-Schriftart abweichen (z. B. Serif für Überschriften)."
              - name: headings
                label: Überschriften
                widget: object
                collapsed: false
                hint: "Größe (rem), Stärke und Transform pro Ebene H1–H6."
                fields:
                  - name: h1
                    label: H1
                    widget: object
                    fields: &fields_heading_level
                      - name: size
                        label: Größe (rem)
                        widget: number
                        value_type: float
                        min: 0.5
                        max: 4
                        step: 0.125
                        default: 2
                        required: true
                      - name: weight
                        label: Stärke
                        widget: select
                        required: true
                        default: "500"
                        options: *font_weight_options
                      - name: transform
                        label: Transform
                        widget: select
                        required: true
                        default: none
                        options: &text_transform_options
                          - { label: Keine, value: none }
                          - { label: Capitalize, value: capitalize }
                          - { label: Uppercase, value: uppercase }
                          - { label: Lowercase, value: lowercase }
                  - name: h2
                    label: H2
                    widget: object
                    fields: *fields_heading_level
                  - name: h3
                    label: H3
                    widget: object
                    fields: *fields_heading_level
                  - name: h4
                    label: H4
                    widget: object
                    fields: *fields_heading_level
                  - name: h5
                    label: H5
                    widget: object
                    fields: *fields_heading_level
                  - name: h6
                    label: H6
                    widget: object
                    fields: *fields_heading_level
          - name: header
            label: Header
            widget: object
            collapsed: false
            hint: "Logo-Position, dann pro Breakpoint: Ruhehöhe, Sticky ein/aus, kompakte Sticky-Höhe. Die Suchlupe steht immer hinter den Menüpunkten. Desktop ≥1024px, Tablet 680–1023px, Mobile <680px."
            fields:
              - name: logoPosition
                label: Logo-Position
                widget: select
                default: left
                options:
                  - { label: "Links (Menü rechts)", value: left }
                  - { label: "Rechts (Menü links)", value: right }
                  - { label: "Mittig (Menü darunter)", value: center }
                hint: "Bei „Mittig“ steht das Menü ab Tablet unter dem Logo. Sticky-Höhen gelten dort als Mindesthöhe (Leiste darf zwei Zeilen hoch sein). Suchlupe immer direkt hinter den Menüpunkten."
              - name: contentWidth
                label: Inhaltsbreite
                widget: select
                default: wide
                options:
                  - { label: Standard (Lesespalte), value: default }
                  - { label: Breit, value: wide }
                  - { label: Vollbreit, value: full }
                hint: "Maximale Breite der Header-Innenzeile (wie Inhaltsbreite: 42 / 64 / 80 rem). Default Breit."
              - name: menu
                label: Menü
                widget: relation
                collection: menus
                value_field: "{{slug}}"
                search_fields: [title]
                display_fields: ["{{title}} ({{slug}})"]
                required: false
                default: main
                hint: "Menü aus der Collection Menüs für die Hauptnavigation (Vorlage: main). Leer = keine Nav und kein Hamburger. Wie Footer Brand → Menü."
              - name: search
                label: Suche
                widget: select
                required: true
                default: visible
                options:
                  - { label: Aus, value: off }
                  - { label: Verstecken, value: hidden }
                  - { label: Anzeigen, value: visible }
                hint: "Aus = Suche komplett aus. Verstecken = keine Lupe im Header (Dialog bleibt für Tastaturkürzel). Anzeigen = Lupe sichtbar."
              - name: minHeightDesktop
                label: Ruhehöhe Desktop (px)
                widget: number
                value_type: int
                default: 64
                min: 40
                max: 600
                hint: "Höhe am Seitenanfang. Mit Sticky gilt sie, bis die Leiste festklebt; ohne Sticky Mindesthöhe (darf wachsen)."
              - name: minHeightTablet
                label: Ruhehöhe Tablet (px)
                widget: number
                value_type: int
                default: 64
                min: 40
                max: 600
              - name: minHeightMobile
                label: Ruhehöhe Mobile (px)
                widget: number
                value_type: int
                default: 56
                min: 40
                max: 600
              - name: stickyDesktop
                label: Sticky auf Desktop
                widget: boolean
                default: true
              - name: stickyTablet
                label: Sticky auf Tablet
                widget: boolean
                default: true
              - name: stickyMobile
